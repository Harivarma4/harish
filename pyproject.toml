[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-ai"
version = "0.1.0"
description = "Project Atlas AI — Institutional AI investment research platform for Indian markets (research tool, not investment advice)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Project Atlas AI" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "bandit>=1.7",
    "duckdb>=1.0",  # default persistence backend; exercised by the test suite
]
# Real Zerodha Kite Connect integration. Not required for mock mode.
kite = [
    "kiteconnect>=4.2",
]
# Real Claude (Anthropic) LLM integration. Not required for mock mode.
anthropic = [
    "anthropic>=0.40",
]
# Durable, embedded DuckDB persistence (the default backend).
duckdb = [
    "duckdb>=1.0",
]
# Durable Postgres persistence. Alternative to the DuckDB default.
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ai"]
# Ship the dashboard's static assets (non-Python files) in the wheel.
artifacts = ["src/atlas_ai/api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "C408",  # dict(key=val) is intentional/readable for wide keyword records
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["atlas_ai"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests"]
