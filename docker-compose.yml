# Project Atlas AI — local stack.
# The API runs standalone on mock adapters. Postgres and Redis are included as
# forward-looking placeholders for later phases (persistence, Celery, caching);
# the app does not yet depend on them.

services:
  api:
    build: .
    image: atlas-ai:local
    environment:
      ATLAS_ENV: local
      ATLAS_ADAPTER_MODE: mock
    ports:
      - "8000:8000"
    restart: unless-stopped

  # --- Forward-looking infrastructure (not yet wired into the app) ---
  postgres:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
